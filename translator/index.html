<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>텍스트 번역기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: two panes (source / result) under a language bar; stacked on narrow screens */
:root {
  color-scheme: light dark;
  --bg: #F1F0EC;
  --surface: #FFFFFF;
  --fg: #1E1F22;
  --muted: #6B6E73;
  --line: #D9D8D2;
  --accent: #2F5BD3;
  --on-accent: #FFFFFF;
  --result: #F7F8FC;
  --danger: #B3322B;
  --font-display: "Space Grotesk", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131416; --surface: #1C1D20; --fg: #E8E9EB; --muted: #9A9DA3; --line: #2F3136;
    --accent: #7C9CF0; --on-accent: #101114; --result: #17181B; --danger: #F08A82;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.app { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; flex: 1 1 140px; }
.swap { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: grid; place-items: center; }
.swap svg { width: 18px; height: 18px; }

.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .panes { grid-template-columns: 1fr; } }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: 1fr auto; min-width: 0; }
.pane.out { background: var(--result); }
textarea, .result { font: inherit; font-size: 16px; line-height: 1.6; color: var(--fg); background: transparent; border: 0; resize: none; padding: 16px; min-height: 220px; width: 100%; overflow-wrap: anywhere; }
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
.result { white-space: pre-wrap; }
.result.empty { color: var(--muted); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px 10px 16px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; padding: 11px 22px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, select:focus-visible, .swap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.hint { color: var(--muted); font-size: 13px; }
.err { color: var(--danger); font-size: 14px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="app">
  <h1>텍스트 번역기</h1>

  <div class="bar">
    <select id="from" aria-label="원본 언어"></select>
    <button class="swap" id="swap" type="button" aria-label="언어 바꾸기" title="언어 바꾸기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 12l4 4-4 4"/><path d="M21 16H7"/></svg>
    </button>
    <select id="to" aria-label="번역할 언어"></select>
  </div>

  <div class="panes">
    <section class="pane">
      <textarea id="src" placeholder="번역할 텍스트를 입력하세요" maxlength="3000" aria-label="원문"></textarea>
      <div class="foot"><span id="count">0 / 3000</span><button class="btn small" id="clear" type="button">지우기</button></div>
    </section>
    <section class="pane out">
      <div class="result empty" id="out" aria-live="polite">번역 결과가 여기에 표시됩니다</div>
      <div class="foot"><span id="detected"></span><button class="btn small" id="copy" type="button" disabled>복사</button></div>
    </section>
  </div>

  <div class="actions">
    <button class="btn primary" id="go" type="button">번역</button>
    <button class="btn" id="stop" type="button" hidden>중지</button>
    <span class="hint">Ctrl+Enter로도 번역할 수 있어요</span>
    <span class="err" id="err" role="alert"></span>
  </div>
  <p class="note">번역은 무료 서비스 MyMemory를 통해 처리돼요. 입력한 텍스트가 그 서비스로 전송되니 개인정보나 비밀 내용은 넣지 마세요. 하루 사용량에 제한이 있어서, 초과하면 다음 날 다시 쓸 수 있어요.</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  // [label, MyMemory code]
  var LANGS = [["한국어", "ko"], ["English", "en"], ["日本語", "ja"], ["中文(简体)", "zh-CN"], ["中文(繁體)", "zh-TW"], ["Español", "es"], ["Français", "fr"], ["Deutsch", "de"], ["Português", "pt"], ["Русский", "ru"], ["Tiếng Việt", "vi"], ["Bahasa Indonesia", "id"], ["ไทย", "th"], ["العربية", "ar"], ["Italiano", "it"]];
  var AUTO = ["언어 자동 감지", "Autodetect"];
  var NAME = {}; LANGS.forEach(function (l) { NAME[l[1]] = l[0]; });
  var MAX_CHUNK = 450;

  var store = {
    get: function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function fill(sel, list, value) {
    sel.innerHTML = "";
    list.forEach(function (l) { var o = document.createElement("option"); o.value = l[1]; o.textContent = l[0]; sel.appendChild(o); });
    sel.value = list.some(function (l) { return l[1] === value; }) ? value : list[0][1];
  }
  fill($("from"), [AUTO].concat(LANGS), store.get("tr-from", "Autodetect"));
  fill($("to"), LANGS, store.get("tr-to", "en"));

  var out = $("out"), ctrl = null;

  function show(text) {
    out.textContent = text || "번역 결과가 여기에 표시됩니다";
    out.classList.toggle("empty", !text);
    $("copy").disabled = !text;
  }
  function busy(on) { $("go").disabled = on; $("stop").hidden = !on; $("go").textContent = on ? "번역 중…" : "번역"; }
  function updateCount() { $("count").textContent = $("src").value.length + " / 3000"; }

  function decode(s) { var t = document.createElement("textarea"); t.innerHTML = s; return t.value; }

  // split into pieces <= MAX_CHUNK, keeping line breaks as separators
  function chunk(text) {
    var pieces = [];
    text.split("\n").forEach(function (line, i, arr) {
      var sentences = line.match(/[^.!?。！？]+[.!?。！？]*\s*/g) || [line];
      var cur = "";
      sentences.forEach(function (s) {
        while (s.length > MAX_CHUNK) { if (cur) { pieces.push({ t: cur }); cur = ""; } pieces.push({ t: s.slice(0, MAX_CHUNK) }); s = s.slice(MAX_CHUNK); }
        if ((cur + s).length > MAX_CHUNK) { pieces.push({ t: cur }); cur = s; } else cur += s;
      });
      if (cur) pieces.push({ t: cur });
      if (i < arr.length - 1) pieces.push({ nl: true });
    });
    return pieces;
  }

  async function translateOne(q, pair, signal) {
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(q) + "&langpair=" + encodeURIComponent(pair);
    var res = await fetch(url, { signal: signal });
    if (!res.ok) throw new Error("http");
    var j = await res.json();
    if (j.quotaFinished || Number(j.responseStatus) === 429) throw new Error("quota");
    if (Number(j.responseStatus) !== 200) throw new Error("api:" + (j.responseDetails || ""));
    return { text: decode(j.responseData.translatedText || ""), lang: j.responseData.detectedLanguage };
  }

  async function translate() {
    var text = $("src").value.replace(/\r/g, "").trim();
    $("err").textContent = ""; $("detected").textContent = "";
    if (!text) { $("err").textContent = "번역할 텍스트를 입력해 주세요."; return; }
    var from = $("from").value, to = $("to").value;
    if (from === to) { $("err").textContent = "원본 언어와 번역 언어가 같아요."; return; }
    ctrl = new AbortController(); busy(true); show("");
    var pieces = chunk(text), result = "", detected = "";
    try {
      for (var i = 0; i < pieces.length; i++) {
        var p = pieces[i];
        if (p.nl) { result += "\n"; continue; }
        if (!p.t.trim()) { result += p.t; continue; }
        var lead = (p.t.match(/^\s*/) || [""])[0], trail = (p.t.match(/\s*$/) || [""])[0];
        var r = await translateOne(p.t.trim(), from + "|" + to, ctrl.signal);
        if (r.lang && !detected) detected = String(r.lang);
        result += lead + r.text + trail;
        show(result);
      }
      if (from === "Autodetect" && detected) {
        var short = detected.split("-")[0].toLowerCase();
        var found = LANGS.filter(function (l) { return l[1].toLowerCase() === detected.toLowerCase() || l[1].toLowerCase() === short; })[0];
        $("detected").textContent = "감지된 언어: " + (found ? found[0] : detected);
      }
    } catch (e) {
      if (e && e.name === "AbortError") { /* stopped by the user */ }
      else if (e && e.message === "quota") $("err").textContent = "오늘 무료 사용량을 모두 썼어요. 내일 다시 시도해 주세요.";
      else if (e && /^api:/.test(e.message)) $("err").textContent = "번역하지 못했어요. " + e.message.slice(4);
      else $("err").textContent = "번역 서비스에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
    } finally { busy(false); ctrl = null; }
  }

  $("src").addEventListener("input", updateCount);
  $("src").addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); translate(); } });
  $("from").addEventListener("change", function () { store.set("tr-from", $("from").value); });
  $("to").addEventListener("change", function () { store.set("tr-to", $("to").value); });
  $("clear").addEventListener("click", function () { $("src").value = ""; updateCount(); show(""); $("err").textContent = ""; $("detected").textContent = ""; $("src").focus(); });
  $("swap").addEventListener("click", function () {
    var f = $("from").value, t = $("to").value;
    if (f === "Autodetect") { $("from").value = t; $("to").value = t === "en" ? "ko" : "en"; }
    else { $("from").value = t; $("to").value = f; }
    store.set("tr-from", $("from").value); store.set("tr-to", $("to").value);
    if (!out.classList.contains("empty")) { $("src").value = out.textContent; updateCount(); show(""); $("detected").textContent = ""; }
  });
  $("copy").addEventListener("click", async function () {
    var b = $("copy");
    try { await navigator.clipboard.writeText(out.textContent); b.textContent = "복사됨"; }
    catch (e) { var r = document.createRange(); r.selectNodeContents(out); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "선택됨"; }
    setTimeout(function () { b.textContent = "복사"; }, 1500);
  });
  $("go").addEventListener("click", translate);
  $("stop").addEventListener("click", function () { if (ctrl) ctrl.abort(); });
})();
</script>
</body>
</html>
